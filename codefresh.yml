version: '1.0'
steps:
  main_clone:
    title: Cloning main repository...
    type: git-clone
    repo: '${{CF_REPO_OWNER}}/${{CF_REPO_NAME}}'
    revision: '${{CF_REVISION}}'
  determine_reponame:
    title: Determining the repository name
    image: codefresh/kube-helm:master
    commands:
      - cf_export REPONAME=$(./scripts/infer_reponame.sh -a ${{CF_COMMIT_AUTHOR}} -b ${{CF_BRANCH}})
      - cf_export IMAGE_TAG='${{CF_BRANCH_TAG_NORMALIZED}}-${{CF_SHORT_REVISION}}'
  determine_reponame_release:
    title: Conditionally determining repository name when triggered by a tagged release
    image: codefresh/kube-helm:master
    commands:
      - cf_export REPONAME="production/k8s-elector"
      - cf_export IMAGE_TAG='${{CF_RELEASE_TAG}}'
    when:
      condition:
        all:
          whenVarExists: 'includes("${{CF_RELEASE_TAG}}", "{{CF_RELEASE_TAG}}") == false'
  setup_build_vars:
    title: Setting up build variables 
    image: golang:1.22-alpine
    commands:
      - cf_export GO_VERSION=$(go version | awk '{ print $3 }')
      - cf_export BUILD_DATE=$(date -u +%Y-%m-%dT%T 2> /dev/null)
      - cf_export VERSION=$(cat VERSION)
  build_image:
    title: Building Docker Image
    type: build
    image_name: ${{REPONAME}}
    registry: ibis-ecr-registry
    disable_push: true
    working_directory: .
    dockerfile: ./Dockerfile
    build_arguments:
      - GO_VERSION=${{GO_VERSION}}
      - BUILD_DATE=${{BUILD_DATE}}
      - VERSION=${{VERSION}}
      - GIT_COMMIT=${{GIT_COMMIT}}
      - GIT_BRANCH=${{CF_BRANCH_TAG_NORMALIZED}}
    tag: ${{IMAGE_TAG}}
  push_to_ecr:
    title: Pushing image to ECR
    type: push
    description: Push tagged image to WattIQ ECR repository
    candidate: ${{build_image}}
    tags:
      - ${{IMAGE_TAG}}
    registry: ibis-ecr-registry
  push_release_to_ecr:
    title: Pushing release image to ECR
    type: push
    description: Push release image to WattIQ ECR repository
    candidate: ${{build_image}}
    tags:
      - ${{CF_RELEASE_NAME}}
      - ${{CF_RELEASE_TAG}}
    registry: ibis-ecr-registry
    when:
      condition:
        all:
          hasReleaseTag: 'match("${{CF_RELEASE_TAG}}", "^v[0-9]+\.[0-9]+\.[0-9]+$", true)'

